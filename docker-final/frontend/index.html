<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de productos</title>
</head>
<body>
    <h1>Catálogo de productos</h1>

    <form id="productForm">
        <input type="text" id="name" placeholder="Nombre" required>
        <input type="text" id="price" placeholder="Precio ($)" required>
        <button type="submit">Agregar</button>
    </form>

    <ul id="productList"></ul>

    <script>
        async function fetchProducts() {
            const res = await fetch('/api/products')
            const items = await res.json()
            const list = document.getElementById('productList')
            list.innerHTML = items.map(p => `<li><strong>${p.name}</strong> <span>$${p.price}</span></
            li>`).join('')
        }

        document.getElementById('productForm').addEventListener('submit', async(e) => {
            e.preventDefault()
            const name = document.getElementById('name').value
            const price = document.getElementById('price').value

            await fetch('/app/products?name=${encodeURIComponent(name)}&price=${enncodeURIComponent(price)}', {method: 'POST'})
            document.getElementById('productList').reset()
            fetchProducts()
        })

        fetchProducts()

    </script>
    
</body>
</html>
